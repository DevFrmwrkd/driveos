name: Build DriveOS Desktop

# Builds the desktop installers without needing local Mac/Windows hardware.
# Trigger manually (Actions tab → Run workflow) or on a version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifact: driveos-desktop-mac
            glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            target: dist:win
            artifact: driveos-desktop-win
            glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Cache the Electron binary AND electron-builder's tool cache (NSIS,
      # winCodeSign, app-builder) so a transient CDN hiccup (HTTP 504) on one run
      # doesn't force a fresh download on the next.
      - name: Cache Electron + builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # `npm ci` runs electron's install.js which downloads the Electron binary
      # from a CDN — that occasionally returns 504. Retry the whole install so a
      # transient network failure doesn't kill the build.
      - name: Install dependencies (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci
        env:
          # Give electron's downloader more headroom before timing out.
          ELECTRON_GET_TIMEOUT: "120000"

      # Retry the build too: electron-builder downloads NSIS/winCodeSign tools
      # from a CDN that also occasionally returns 504. A retry clears it.
      - name: Build desktop installer (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run ${{ matrix.target }} --workspace=apps/desktop
        env:
          # electron-builder: don't try to publish; just build artifacts.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. To sign, add CSC_LINK / CSC_KEY_PASSWORD (and Apple
          # notarization vars on mac) as repo secrets — see apps/desktop/INSTALLER.md.

      # Show exactly what electron-builder produced (helps debug missing artifacts).
      - name: List build output
        if: always()
        shell: bash
        run: ls -la apps/desktop/release/ || echo "release dir not found"

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: warn

  # Publish the built installers to a public GitHub Release so the web download
  # page's /releases/latest/download/DriveOS-Agent-mac.dmg (and -win.exe) URLs
  # resolve. Runs only on a desktop-v* tag, after both platform builds finish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DriveOS Agent ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/DriveOS-Agent-mac.dmg
            artifacts/**/DriveOS-Agent-win.exe
            artifacts/**/*.zip
