name: Regression Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Bundling and type checks do not need the Electron runtime download.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression tests
        run: npm test

      - name: Typecheck Convex
        run: npx tsc -p convex/tsconfig.json --noEmit

      - name: Typecheck desktop
        run: npm run typecheck --workspace=apps/desktop

      # These builds require no backend process, deployment credentials, or
      # external service calls. The shared/agent tests run on both platforms.
      - name: Build web dashboard
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:web
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211

      - name: Build desktop bundle
        if: matrix.os == 'ubuntu-latest'
        run: npm run build --workspace=apps/desktop

