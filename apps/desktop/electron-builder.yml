appId: media.frmwrkd.driveos.agent
productName: DriveOS Agent
copyright: DriveOS
# We only want local artifacts (uploaded as CI artifacts), never a GitHub release.
publish: null
# Pinned so electron-builder doesn't need electron resolvable in this workspace
# (it's hoisted to the monorepo root in our npm workspaces setup).
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# Main + preload are bundled by esbuild (all deps inlined), so there are NO app
# runtime dependencies to collect. Skipping node_modules entirely avoids the
# electron-builder workspace dependency-collection failures in our npm monorepo.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Ship only the bundled JS, the renderer, and package.json — no node_modules.
files:
  - dist/**/*
  - renderer/**/*
  - package.json

# Ship the self-contained agent bundle (one CJS file, all deps inlined) as an
# unpacked resource. agentBridge.ts resolves it at resources/agent/agent-bundle.cjs.
extraResources:
  - from: ../agent/dist/agent-bundle.cjs
    to: agent/agent-bundle.cjs
  - from: build/icon.png
    to: build/icon.png

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Unsigned by default — see INSTALLER.md for signing/notarization.

win:
  target:
    - nsis
    # Portable zip fallback — needs no code-sign cache, so it always builds even
    # if the NSIS installer step hits a signing-tool issue on a runner.
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  target:
    - AppImage
